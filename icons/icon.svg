<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Atom Orbital Ellipses -->
  <g transform="translate(256, 230)">
    <!-- Orbit 1 (Horizontal) -->
    <ellipse rx="160" ry="58" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
    <!-- Orbit 2 (Rotated 60 deg) -->
    <ellipse rx="160" ry="58" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.85" transform="rotate(60)"/>
    <!-- Orbit 3 (Rotated -60 deg) -->
    <ellipse rx="160" ry="58" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.85" transform="rotate(-60)"/>

    <!-- Electrons on orbits -->
    <circle cx="160" cy="0" r="11" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="-80" cy="138" r="11" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-80" cy="-138" r="11" fill="#c084fc" filter="url(#glow)"/>

    <!-- Nucleus Core -->
    <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="-6" cy="-6" r="10" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Branding Badge -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-36" width="220" height="48" rx="24" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="0" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">SILAB</text>
  </g>
</svg>
